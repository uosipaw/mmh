    <!-- Early device detection script -->
    <script>
        (function () {
            window.isMobile =
                /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
                    navigator.userAgent
                ) || window.innerWidth <= 768;
            document.documentElement.className = window.isMobile
                ? "mobile-device"
                : "desktop-device";
        })();
    </script>
