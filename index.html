<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MDSN Arts Landing Page</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mobile-tweaks.css" />
</head>

<body>
    <main class="landing-page">
        <section class="opening-mobile" id="openingMobile">
            <div class="curtain-stage" id="curtainStage">
                <img class="curtain-piece curtain-slide curtain-slide-left" src="images/CURTAINSLIDE.png" alt=""
                    aria-hidden="true" />
                <img class="curtain-piece curtain-slide curtain-slide-right" src="images/CURTAINSLIDE.png" alt=""
                    aria-hidden="true" />
                <img class="curtain-piece curtain-up" src="images/CURTAINUP.png" alt="" aria-hidden="true" />
                <img class="curtain-piece curtain-left" src="images/curtainleft.png" alt="" aria-hidden="true" />
                <img class="curtain-piece curtain-right" src="images/curtainright.png" alt="" aria-hidden="true" />
                <button class="curtain-open-button" id="curtainOpenButton" type="button" aria-label="Enter">
                    <span class="curtain-button-string" aria-hidden="true"></span>
                    <img src="images/enter.png" alt="" aria-hidden="true" />
                </button>
            </div>

            <div class="mobile-layer" aria-label="Animated hanging paper mobile">
                <!-- CLOUDS -->

                <figure class="hanger cloud cloud-1 double-hung" style="
            --x: 5%;
            --y: -3%;
            --w: clamp(120px, 24vw, 220px);
            --string: clamp(128px, 18svh, 205px);
            --left-string: 27%;
            --right-string: 72%;
            --string-color-top: #f8dde9;
            --string-color-bottom: #d77fa4;
            --tilt: -1.5deg;
          ">
                    <span class="pin pin-left"></span>
                    <span class="pin pin-right"></span>

                    <div class="swing-arm">
                        <div class="double-string">
                            <span></span>
                            <span></span>
                        </div>

                        <img src="images/CLOUD1.png" alt="" />
                    </div>
                </figure>

                <figure class="hanger cloud cloud-2 double-hung" style="
            --x: 31%;
            --y: -5%;
            --w: clamp(175px, 35vw, 325px);
            --string: clamp(168px, 23svh, 275px);
            --left-string: 32%;
            --right-string: 68%;
            --string-color-top: #d7f3ff;
            --string-color-bottom: #66aecd;
            --tilt: 1deg;
          ">
                    <span class="pin pin-left"></span>
                    <span class="pin pin-right"></span>

                    <div class="swing-arm">
                        <div class="double-string">
                            <span></span>
                            <span></span>
                        </div>

                        <img src="images/CLOUD2.png" alt="" />
                    </div>
                </figure>

                <figure class="hanger cloud cloud-3 double-hung" style="
            --x: 63%;
            --y: -4%;
            --w: clamp(110px, 22vw, 205px);
            --string: clamp(215px, 29svh, 340px);
            --left-string: 30%;
            --right-string: 70%;
            --string-color-top: #f8efb7;
            --string-color-bottom: #d1a63a;
            --tilt: 1.8deg;
          ">
                    <span class="pin pin-left"></span>
                    <span class="pin pin-right"></span>

                    <div class="swing-arm">
                        <div class="double-string">
                            <span></span>
                            <span></span>
                        </div>

                        <img src="images/CLOUD3.png" alt="" />
                    </div>
                </figure>

                <!-- LETTERS -->

                <figure class="hanger letter letter-m double-hung" style="
            --x: 8%;
            --y: -3%;
            --w: clamp(125px, 22vw, 220px);
            --string: clamp(330px, 44svh, 535px);
            --left-string: 28%;
            --right-string: 72%;
            --string-color-top: #f7c8dd;
            --string-color-bottom: #c75687;
            --tilt: -4deg;
          ">
                    <span class="pin pin-left"></span>
                    <span class="pin pin-right"></span>

                    <div class="swing-arm">
                        <div class="double-string">
                            <span></span>
                            <span></span>
                        </div>

                        <img src="images/MCUTOUT.png" alt="M" />
                    </div>
                </figure>

                <figure class="hanger letter letter-d single-hung" style="
            --x: 19%;
            --y: -4%;
            --w: clamp(112px, 20vw, 200px);
            --string: clamp(320px, 42svh, 520px);
            --attach: 0px;
            --string-color-top: #cce8ff;
            --string-color-bottom: #4c8ec0;
            --tilt: 2deg;
          ">
                    <span class="pin"></span>

                    <div class="swing-arm">
                        <span class="single-string"></span>

                        <img src="images/DCUTOUT.png" alt="D" />
                    </div>
                </figure>

                <figure class="hanger letter letter-s single-hung" style="
            --x: 30%;
            --y: -2%;
            --w: clamp(120px, 21vw, 215px);
            --string: clamp(400px, 52svh, 625px);
            --attach: -6px;
            --string-color-top: #f9e7a9;
            --string-color-bottom: #c98e26;
            --tilt: -2.5deg;
          ">
                    <span class="pin"></span>

                    <div class="swing-arm">
                        <span class="single-string"></span>

                        <img src="images/SCUTOUT.png" alt="S" />
                    </div>
                </figure>

                <figure class="hanger letter letter-n single-hung" style="
            --x: 41%;
            --y: -3%;
            --w: clamp(116px, 20.5vw, 208px);
            --string: clamp(370px, 48svh, 580px);
            --attach: 5px;
            --string-color-top: #d8f2dc;
            --string-color-bottom: #5ca16b;
            --tilt: 3deg;
          ">
                    <span class="pin"></span>

                    <div class="swing-arm">
                        <span class="single-string"></span>

                        <img src="images/NCUTOUT.png" alt="N" />
                    </div>
                </figure>

                <button class="hanger sun single-hung" id="dropdownSun" type="button" aria-label="Make the sun angry"
                    aria-pressed="false" style="
            --x: 62%;
            --y: -4%;
            --w: clamp(250px, 48vw, 450px);
            --string: clamp(185px, 28svh, 335px);
            --attach: 0px;
            --string-color-top: #ffe8a6;
            --string-color-bottom: #e09b23;
            --tilt: 2deg;
          ">
                    <span class="pin"></span>

                    <span class="swing-arm">
                        <span class="single-string"></span>

                        <img src="images/SUNSMILE.png" alt="" data-smile-src="images/SUNSMILE.png"
                            data-angry-src="images/SUNANGRY.png" />
                    </span>
                </button>

            </div>

            <img class="dont-touch-callout" id="dontTouchCallout" src="images/donttouch.png" alt="" aria-hidden="true" />
        </section>

        <nav class="scroll-banner-divider" id="scrollBannerDivider" aria-label="Page sections">
            <span class="banner-roller banner-roller-left" aria-hidden="true"></span>
            <div class="banner-scroll">
                <a href="#artPages">Art</a>
                <a href="paint.html">Paint</a>
                <a href="tarot.html">Tarot</a>
            </div>
            <span class="banner-roller banner-roller-right" aria-hidden="true"></span>
        </nav>

        <section class="landing-links paint-scroll-section" id="artPages" aria-label="Art pages">
            <div class="paint-splotch paint-splotch-red" aria-hidden="true"></div>
            <div class="paint-splotch paint-splotch-blue" aria-hidden="true"></div>
            <div class="paint-splotch paint-splotch-yellow" aria-hidden="true"></div>
            <div class="paint-splotch paint-splotch-pink" aria-hidden="true"></div>
            <div class="paint-splotch paint-splotch-black" aria-hidden="true"></div>

            <nav class="landing-link-grid">
                <a class="landing-link landing-link-paint" href="paint.html" style="--link-tilt: 2deg;">
                    <span class="landing-link-image" data-label="Paint"></span>
                    <span class="landing-link-text">Paint</span>
                </a>

                <a class="landing-link landing-link-gallery is-placeholder" href="#artPages" aria-disabled="true"
                    style="--link-tilt: -3deg;">
                    <span class="landing-link-image" data-label="Gallery"></span>
                    <span class="landing-link-text">Gallery</span>
                </a>

                <a class="landing-link landing-link-sketchbook is-placeholder" href="#artPages" aria-disabled="true"
                    style="--link-tilt: 1.5deg;">
                    <span class="landing-link-image" data-label="Sketch"></span>
                    <span class="landing-link-text">Sketchbook</span>
                </a>

                <a class="landing-link landing-link-collage is-placeholder" href="#artPages" aria-disabled="true"
                    style="--link-tilt: -1.5deg;">
                    <span class="landing-link-image" data-label="Collage"></span>
                    <span class="landing-link-text">Collage</span>
                </a>

                <a class="landing-link landing-link-studio is-placeholder" href="#artPages" aria-disabled="true"
                    style="--link-tilt: 3deg;">
                    <span class="landing-link-image" data-label="Studio"></span>
                    <span class="landing-link-text">Studio</span>
                </a>

                <a class="landing-link landing-link-color is-placeholder" href="#artPages" aria-disabled="true"
                    style="--link-tilt: -2deg;">
                    <span class="landing-link-image" data-label="Color"></span>
                    <span class="landing-link-text">Color</span>
                </a>
            </nav>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
