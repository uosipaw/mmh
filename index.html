                    navigator.userAgent
                ) || window.innerWidth <= 768;

        })();

        <!-- Overlay to capture touch events for iOS autoplay -->
        <div id="touch-to-play">
            <span>Tap to play</span>
        </div>

        <script>
            // Handle video playback and image map visibility
            (function () {
                const video = document.getElementById("background-video");
                const touchToPlay = document.getElementById("touch-to-play");
                const mobileImageMap = document.getElementById("mobile-image-map");
                const desktopImageMap = document.getElementById("desktop-image-map");

                // Show the appropriate image map based on the device type
                if (window.isMobile) {
                    if (mobileImageMap) {
                        mobileImageMap.style.display = "block";
                    }
                } else {
                    if (desktopImageMap) {
                        desktopImageMap.style.display = "block";
                    }
                    video.setAttribute("loop", "");
                }

                function attemptPlay() {
                    // Remove overlay once we're trying to play
                    if (touchToPlay) {
                        touchToPlay.style.display = "none";
                    }

                    video.play().catch(function (error) {
                        console.log("Autoplay failed:", error);

                        // Show the overlay for user interaction
                        if (touchToPlay) {
                            touchToPlay.style.display = "flex";
                            touchToPlay.addEventListener("click", function () {
                                video.play();
                                touchToPlay.style.display = "none";
                            });
                        }
                    });
                }

                // iOS specific handling
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    video.setAttribute("webkit-playsinline", "webkit-playsinline");
                    // iOS often requires a user gesture
                    const touchOverlay = document.getElementById("touch-to-play");
                    if (touchOverlay) {
                        touchOverlay.addEventListener(
                            "touchstart",
                            function () {
                                attemptPlay();
                            },
                            { once: true }
                        );
                    }
                }

                // Handle general play attempts
                if (document.readyState === "complete") {
                    attemptPlay();
                } else {
                    window.addEventListener("load", attemptPlay);
                }

                // Try once more after a delay (helps with some browsers)
                setTimeout(attemptPlay, 1000);
            })();
        </script>
