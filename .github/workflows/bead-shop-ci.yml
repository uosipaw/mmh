name: Bead shop build and tests

on:
  push:
    branches:
      - cloudflare-bead-orders
  pull_request:
    paths:
      - "beads/**"
      - "worker/**"
      - "migrations/**"
      - "scripts/build-cloudflare.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tests/cloudflare.test.mjs"
      - ".github/workflows/bead-shop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website and bead order app
        run: npm run build
      - name: Run Worker security and order tests
        run: npm test
