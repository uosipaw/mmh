<!DOCTYPE html>
<html lang="en">

<head>
    <title>work in progress</title>
    <meta charset="utf-8" />
    <meta name="description" content="Tarot Card Reading Application" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" type="text/css" href="tarot.css" />
    <link rel="preload" href="tarot-cards.json" as="fetch" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- Added jQuery -->
</head>

<body>
    <div class="container left-container">
        <div class="container-content">

            <div class="dropdown hover">
                <select class="spreadSelect" id="spreadSelect">
                    <option value="default" selected>Choose a Spread</option>
                    <option value="celtic-cross">Celtic Cross</option>
                    <option value="guidance">Guidance</option>
                    <li data-value="ancestral-connection">Ancestral Connection</li>
                    <option value="two-options">Two Options</option>
                    <option value="three-card">Three-Card</option>
                </select>
            </div>
            <br>
        </div>

        <div id="controls">
            <button id="randomizeBtn" class="icon-button" title="Randomize">
                <i src="./images/001_magic.png" alt="Randomize" width="50" height="50"></i>
            </button><br>

            <button id="resetBtn" class="icon-button" title="Reset">
                <i src="./images/006_magic.png" alt="Reset" width="50" height="50"></i>
            </button><br>

            <button id="reshuffleBtn" class="icon-button" title="Reshuffle">
                <i src="./images/004_magic.png" alt="Reshuffle" width="50" height="50"></i>
            </button>
        </div>

        <div id="deck">
            <!-- Example card structure for fallback -->
            <div class="card">
                <div class="card-inner">
                    <div class="card-front" style="background-image: url('./images/tarot/fool.png');"></div>
                    <div class="card-back" style="background-image: url('./images/tarot/back.png');"></div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div class="container right-container">
        <div id="cardModal" class="modal">
            <div class="modal-content">
                <span class="close-modal">×</span>
                <div id="modalCardDescription"></div>
            </div>
        </div>
    </div>



    <script src="tarot.js" defer></script>

</body>

</html>
