<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarot Card Reader</title>
    <link rel="stylesheet" href="./tarot.css" />
    <link rel="preload" href="./fonts/MyHappyEnding.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="./fonts/a_font_with_serifs.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="./fonts/Sticky Notes.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
</head>

<body>
    <div class="controls">
        <label for="spread-select">Choose a spread:</label>
        <select id="spread-select">
            <option value="3">Three-Card Spread</option>
            <option value="celtic">Celtic Cross</option>
        </select>
        <button id="deal-btn">Deal Cards</button>
        <input type="text" id="search-input" placeholder="Search card..." />
        <div id="search-results" role="listbox" aria-label="Card matches"></div>
    </div>

    <div id="cards-container" aria-live="polite"></div>

    <!-- Modal -->
    <div id="card-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content card-modal-bg">
            <button id="modal-close" class="modal-close-btn" aria-label="Close dialog">✕</button>
            <div class="card-modal-image-bg">
                <div class="card-modal-image-only"></div>
                <div class="card-modal-header">
                    <h2 id="modal-title"></h2>
                    <div id="modal-reversed" class="modal-reversed-label"></div>
                    <div id="modal-keywords" class="modal-keywords"></div>
                </div>
                <div class="card-modal-desc-wrapper">
                    <p id="modal-desc"></p>
                </div>
                <div class="card-modal-fade"></div>
            </div>
        </div>
    </div>

    <script src="./tarot.js" defer></script>
</body>

</html>
