<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarot Reading</title>
    <link rel="stylesheet" href="tarot.css" />
</head>

<body>
    <div class="tarot-layout">
        <div class="spreadselector">
            <div id="spreadOptions" class="icon-radio-group">
                <div class="icon-option" data-value="threeCard" title="Three Card">
                    <img src="icons/.png" alt="Three Card">
                </div>
                <div class="icon-option" data-value="celticCross" title="Celtic Cross">
                    <img src="icons/celtic-cross.png" alt="Celtic Cross">
                </div>
                <div class="icon-option" data-value="crossSpread" title="Cross Spread">
                    <img src="icons/cross-spread.png" alt="Cross Spread">
                </div>
                <div class="icon-option" data-value="horseshoe" title="Horseshoe">
                    <img src="icons/horseshoe.png" alt="Horseshoe">
                </div>
                <div class="icon-option" data-value="pentagram" title="Pentagram">
                    <img src="icons/pentagram.png" alt="Pentagram">
                </div>
                <div class="icon-option" data-value="eightCards" title="Eight Cards">
                    <img src="icons/eight-cards.png" alt="Eight Cards">
                </div>
                <div class="icon-option" data-value="sixCards" title="Six Cards">
                    <img src="icons/six-cards.png" alt="Six Cards">
                </div>
                <div class="icon-option" data-value="loveSpread" title="Love Spread">
                    <img src="icons/love-spread.png" alt="Love Spread">
                </div>
            </div>
        </div>

        <div class="tarot-left">
        </div>

        <input type="hidden" id="spreadSelect" name="spread" value="default">
        <div id="spreadDescriptions" class="spread-descriptions"></div>
    </div>
    <div class="tarot-right">
        <div id="deck"></div>
    </div>
    </div>

    <div id="controls">
        <button id="reshuffleBtn">🔄</button>
        <button id="resetBtn">♻️</button>
    </div>

    <div id="cardModal" class="modal">
        <div class="modal-content">
            <!-- Modal content will be injected here -->
        </div>
    </div>

    <script src="tarot.js"></script>
</body>

</html>
