<!DOCTYPE html>
<html lang="en">

<head>
    <title>Tarot Card Reading</title>
    <meta charset="utf-8" />
    <meta name="description" content="Tarot Card Reading Application" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" type="text/css" href="tarot.css" />
    <link rel="preload" href="tarot-cards.json" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="./images/tarot/back.png" as="image">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>

<body>
    <div class="background"> </div>

    <div class="container left-container">
        <div class="container-content">
            <div id="controls">
                Spread:
                <select id="spreadSelect">
                    <option value="celtic-cross">Celtic Cross</option>
                    <option value="guidance">Guidance</option>
                    <option value="ancestral-connection">Ancestral Connection</option>
                    <option value="two-options">Two Options</option>
                    <option value="three-card">Three-Card</option>
                    <option value="fan">Fan</option>
                </select>
                <button id="randomizeBtn">Randomize</button>
                <button id="resetBtn">Reset</button>

                <button id="reshuffleBtn">Reshuffle</button>
            </div>
            <div id="deck"></div>
        </div>
    </div>

    <div class="container right-container">
        <div id="cardModal" class="modal">
            <div class="modal-content">
                <span class="close-modal">×</span>
                <div id="modalCardDescription"></div>
            </div>
        </div>
    </div>

    <script src="tarot.js" defer></script>
</body>

</html>
