<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarot Reading</title>
    <link rel="stylesheet" href="tarot.css" />
</head>

<body>
    <div class="tarot-layout">
        <div class="tarot-left">
            <select id="spreadSelect">
                <option value="default">Select a spread</option>
                <option value="threeCard">Three Card</option>
                <option value="celticCross">Celtic Cross</option>
            </select>
            <div id="spreadDescriptions" class="spread-descriptions"></div>
        </div>
        <div class="tarot-right">
            <div id="deck"></div>
        </div>
    </div>

    <div id="controls">
        <button id="reshuffleBtn">🔄</button>
        <button id="resetBtn">♻️</button>
    </div>

    <div id="cardModal" class="modal">
        <div class="modal-content"></div>
    </div>

    <script src="tarot.js"></script>
</body>

</html>
