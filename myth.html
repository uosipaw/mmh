<!DOCTYPE html>
<html>

<head>
    <title>myth match</title>
    <link rel="stylesheet" type="text/css" href="myth.css">
    <link rel="stylesheet" type="text/css" href="navmenu.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <meta name="description" content="description">
    <script src="myth.js" defer></script>
</head>

<body class="myth-page">
    <main>
        <div id="stats"></div>
        <div class="victory"></div>
        <section class="card_table" id="cardTable"></section>

    </main>
    <aside>
        <p>Find all the pairs</p>
        <h1>Myth-Match</h1>

        <div class="level-checker-button-group">
            <div class="radio-btn">
                <input type="radio" name="level" id="easier" value="easier">
                <label for="easier">Easier</label>
            </div>
            <div class="radio-btn">
                <input type="radio" checked name="level" id="easy" value="easy">
                <label for="easy">Easy</label>
            </div>
            <div class="radio-btn">
                <input type="radio" name="level" id="normal" value="normal">
                <label for="normal">Normal</label>
            </div>
            <div class="radio-btn">
                <input type="radio" name="level" id="hard" value="hard">
                <label for="hard">Hard</label>
            </div>
            <div class="radio-btn">
                <input type="radio" name="level" id="harder" value="harder">
                <label for="harder">Harder</label>
            </div>
        </div>

        <button class="start-button" onclick="start(this)">Start</button>
        <small>original Game Design by<a target="_black" href="https://codepen.io/rodzyk">Andrii Rodzyk</a></small>
    </aside>


</body>

</html>
