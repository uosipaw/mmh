<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Matching Game</title>
    <link rel="stylesheet" href="myth.css" />
    <!-- Font-face declaration moved to CSS -->
</head>

<body>
    <div class="top-panel">
        <div class="controls">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="0">-</option>
                <option value="1" style="font-family: 'love ya like a sister', sans-serif;">easiest</option>
                <option value="2" style="font-family: 'love ya like a sister', sans-serif;">easier</option>
                <option value="3" style="font-family: 'love ya like a sister', sans-serif;">medium</option>
                <option value="4" style="font-family: 'love ya like a sister', sans-serif;">hard</option>
                <option value="5" style="font-family: 'love ya like a sister', sans-serif;">hardest</option>
            </select>
            <button class="startBtn" id="startBtn"
                style="font-family: 'love ya like a sister', sans-serif; transform: rotate(3deg); margin: 5%">play!</button>
            <h1>Myth Match</h1>
            <p>select difficulty, then hit start to play!</p>
        </div>
    </div>

    <div class="container">
        <div class="game-board" id="gameBoard">
            <!-- Cards will be dynamically added here -->
        </div>
        <p id="message"></p>
    </div>
    <div class="leaderboard-panel" id="leaderboardPanel" aria-label="Leaderboard" tabindex="0">
        <h2>Leaderboard</h2>
        <ol id="leaderboardList"></ol>
    </div>
    <script src="myth.js"></script>
</body>

</html>
